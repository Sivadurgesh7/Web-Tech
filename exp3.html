<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            width: 350px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: white;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        .error {
            color: red;
            font-size: 12px;
        }
        button {
            background-color: blue;
            color: white;
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
        }
        button:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">Validation Form</h2>
    <form id="myForm">
        <label>Name:</label><br>
        <input type="text" id="name"><br>
        <span class="error" id="nameError"></span><br>

        <label>Email:</label><br>
        <input type="email" id="email"><br>
        <span class="error" id="emailError"></span><br>

        <label>Phone:</label><br>
        <input type="text" id="phone"><br>
        <span class="error" id="phoneError"></span><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female <br>
        <span class="error" id="genderError"></span><br>

        <label>Country:</label><br>
        <select id="country">
            <option value="">Select Country</option>
            <option value="USA">USA</option>
            <option value="India">India</option>
            <option value="UK">UK</option>
            <option value="Australia">Australia</option>
            <option value="Canada">Canada</option>
        </select><br>
        <span class="error" id="countryError"></span><br>

        <label>Address:</label><br>
        <input type="text" id="address"><br>
        <span class="error" id="addressError"></span><br>

        <label>Date of Birth:</label><br>
        <input type="date" id="dob"><br>
        <span class="error" id="dobError"></span><br>

        <label>Password:</label><br>
        <input type="password" id="password"><br>
        <span class="error" id="passwordError"></span><br>

        <label>Confirm Password:</label><br>
        <input type="password" id="confirmPassword"><br>
        <span class="error" id="confirmPasswordError"></span><br>

        <input type="checkbox" id="terms"> I agree to the terms<br>
        <span class="error" id="termsError"></span><br>

        <button type="button" onclick="validateForm()">Submit</button>
    </form>
</div>

<script>
    function validateForm() {
        let isValid = true;

        // Name validation (only letters and spaces allowed)
        let name = document.getElementById("name").value;
        let namePattern = /^[A-Za-z\s]+$/; // Allows only letters and spaces
        if (!name) {
            document.getElementById("nameError").innerText = "Name is required";
            isValid = false;
        } else if (!name.match(namePattern)) {
            document.getElementById("nameError").innerText = "Name cannot contain numbers or special characters";
            isValid = false;
        } else {
            document.getElementById("nameError").innerText = "";
        }

        // Email validation
        let email = document.getElementById("email").value;
        let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        document.getElementById("emailError").innerText = email.match(emailPattern) ? "" : "Enter a valid email";
        if (!email.match(emailPattern)) isValid = false;

        // Phone validation (only 10-digit numbers)
        let phone = document.getElementById("phone").value;
        let phonePattern = /^[0-9]{10}$/;
        document.getElementById("phoneError").innerText = phone.match(phonePattern) ? "" : "Enter a valid 10-digit phone number";
        if (!phone.match(phonePattern)) isValid = false;

        // Gender validation
        let gender = document.querySelector('input[name="gender"]:checked');
        document.getElementById("genderError").innerText = gender ? "" : "Select gender";
        if (!gender) isValid = false;

        // Country validation
        let country = document.getElementById("country").value;
        document.getElementById("countryError").innerText = country ? "" : "Select a country";
        if (!country) isValid = false;

        // Address validation
        let address = document.getElementById("address").value;
        document.getElementById("addressError").innerText = address ? "" : "Address is required";
        if (!address) isValid = false;

        // Date of Birth validation
        let dob = document.getElementById("dob").value;
        document.getElementById("dobError").innerText = dob ? "" : "Select Date of Birth";
        if (!dob) isValid = false;

        // Password validation
        let password = document.getElementById("password").value;
        document.getElementById("passwordError").innerText = password.length >= 6 ? "" : "Password must be at least 6 characters";
        if (password.length < 6) isValid = false;

        // Confirm Password validation
        let confirmPassword = document.getElementById("confirmPassword").value;
        document.getElementById("confirmPasswordError").innerText = (confirmPassword === password) ? "" : "Passwords do not match";
        if (confirmPassword !== password) isValid = false;

        // Terms checkbox validation
        let terms = document.getElementById("terms").checked;
        document.getElementById("termsError").innerText = terms ? "" : "You must agree to the terms";
        if (!terms) isValid = false;

        // If all fields are valid, show success message
        if (isValid) {
            alert("Form submitted successfully!");
        }
    }
</script>

</body>
</html>
